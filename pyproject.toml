[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "asymmetric-insight-engine"
version = "0.1.0"
description = "Point-in-time, evidence-first investment research and capital-allocation engine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Asymmetric Insight Engine contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
asymmetric-engine = "asymmetric_engine.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asymmetric_engine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=asymmetric_engine --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["asymmetric_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["asymmetric_engine", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
